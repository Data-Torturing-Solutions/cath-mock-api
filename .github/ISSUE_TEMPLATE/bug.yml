name: Bug
description: Something is broken in production, in a build, or on a droplet
labels: ["bug", "p1"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What is broken
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: Where it was seen
      description: URL, Worker name, droplet, or a link to the failing workflow run.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      value: |
        **Expected:**

        **Actual:**
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        Logs, the alert that fired, a run link. Redact anything that looks like
        a credential before pasting.

  - type: input
    id: since
    attributes:
      label: Known-good point
      description: Last commit, deploy or date where this worked, if you know it.

  - type: textarea
    id: verify
    attributes:
      label: How to verify the fix
    validations:
      required: true
