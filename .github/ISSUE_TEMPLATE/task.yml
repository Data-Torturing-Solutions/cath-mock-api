name: Task
description: A unit of work — a feature, a change, or a piece of ops
labels: ["task", "p2"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What needs doing
      description: >
        One or two sentences. Assume the reader has none of the context from
        wherever this came up — including you, in three weeks.
    validations:
      required: true

  - type: input
    id: surface
    attributes:
      label: Affected repo, site or droplet
      placeholder: e.g. vertical-circuit / the circuit droplet / makersmap.co.uk

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What has to be true before this can be closed.
      value: |
        - [ ]
    validations:
      required: true

  - type: textarea
    id: verify
    attributes:
      label: How to verify
      description: >
        The command, URL or check that proves it works. "Looks right" is not
        verification.
    validations:
      required: true

  - type: dropdown
    id: autonomy
    attributes:
      label: Can this be picked up unattended?
      description: >
        If anything here is still an open question, say so — a half-specified
        task handed to an agent costs more than it saves.
      options:
        - Yes — the spec above is complete
        - No — needs a decision from me first
    validations:
      required: true
